version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Remove once the tools this app builds with declare support for TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "zone.js"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
