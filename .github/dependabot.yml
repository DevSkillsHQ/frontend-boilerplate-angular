# Grouped, weekly updates (QOHA-3756). Majors of packages that only work together arrive
# as one PR per family; every minor and patch update of a directory arrives as one PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "zone.js"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
